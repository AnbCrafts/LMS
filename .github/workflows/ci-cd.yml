name: EduPulse LMS CI/CD Pipeline

on:
  push:
    branches:
      - master
      - anb_home
  pull_request:
    branches:
      - master
      - anb_home
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. SECURITY & SECRET LEAK AUDIT
  # =========================================================================
  security-audit:
    name: Security & Secret Leak Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Tracked .env Files
        run: |
          echo "Auditing repository for uncommitted or leaked secrets..."
          if git ls-files | grep -E "(^|/)\.env$"; then
            echo "::error::Found tracked .env file! Remove it from git cache immediately."
            exit 1
          else
            echo "No tracked .env files detected. Secret hygiene verified."
          fi

  # =========================================================================
  # 2. BUILD & COMPILE ASP.NET MVC 5 (.NET FRAMEWORK 4.7.2)
  # =========================================================================
  build-dotnet:
    name: Build ASP.NET MVC 5 (.NET 4.7.2)
    runs-on: windows-latest
    needs: [security-audit]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NuGet CLI
        uses: NuGet/setup-nuget@v2

      - name: Setup MSBuild Engine
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet Packages
        run: |
          nuget restore LMSPractice.sln

      - name: Compile Solution (Release Mode)
        run: |
          msbuild LMSPractice.sln /p:Configuration=Release /p:DeployOnBuild=true /p:WebPublishMethod=Package /p:PackageAsSingleFile=true /p:PackageLocation="%GITHUB_WORKSPACE%\artifacts\EduPulse_Web_Release.zip" /maxcpucount

      - name: Upload Compiled Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edupulse-mvc-release
          path: artifacts/
          retention-days: 7

  # =========================================================================
  # 3. TEST & VALIDATE PYTHON RAG AI MICROSERVICE
  # =========================================================================
  test-python-ai:
    name: Test Python RAG AI Service (Python 3.12)
    runs-on: ubuntu-latest
    needs: [security-audit]

    defaults:
      run:
        working-directory: WebApplication1/Rag_Service

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: WebApplication1/Rag_Service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Module Imports & Dependencies
        run: |
          python -c "
          import fastapi, chromadb, pypdf, rank_bm25, dotenv
          print('All core AI & RAG dependencies imported successfully!')
          "

      - name: Run RBAC Metadata Filter Tests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'dummy_test_key_for_ci' }}
        run: |
          python test_filters.py

  # =========================================================================
  # 4. CONTINUOUS DEPLOYMENT (CD) - BRANCH TARGETED
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging (anb_home branch)
    needs: [build-dotnet, test-python-ai]
    if: github.ref == 'refs/heads/anb_home' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Staging Deployment Notification
        run: |
          echo "========================================================="
          echo " Staging verification passed for branch 'anb_home'!"
          echo " Commit: ${{ github.sha }}"
          echo " Automated build & tests succeeded."
          echo " Ready for Staging testing / local sync."
          echo "========================================================="

  deploy-production:
    name: Deploy to Production (master branch)
    needs: [build-dotnet, test-python-ai]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: edupulse-mvc-release
          path: deploy/

      - name: Trigger Render.com AI Microservice Deploy Hook
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          echo "Notifying Render.com to trigger live AI Microservice deployment..."
          curl -X POST "$RENDER_DEPLOY_HOOK"

      - name: Production Deployment Complete
        run: |
          echo "Production deployment pipeline executed successfully for master branch!"
